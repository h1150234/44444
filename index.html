<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow of Redemption</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  overflow:hidden;
}

#movie{
  position:relative;
  width:100vw;
  height:100vh;
  background:#050505;
  overflow:hidden;
}

/* 電影黑邊 */
#movie::before,
#movie::after{
  content:"";
  position:absolute;
  left:0;
  width:100%;
  height:7vh;
  background:black;
  z-index:50;
}

#movie::before{
  top:0;
}

#movie::after{
  bottom:0;
}

/* 場景背景 */
#background{
  position:absolute;
  inset:0;
  transition:
    background 1.3s ease,
    transform 5s ease,
    filter 1s ease;
}

.scene-police{
  background:
    radial-gradient(circle at 25% 40%,#243342 0,#111820 35%,#030405 75%);
}

.scene-street{
  background:
    linear-gradient(115deg,#0d1115,#222831,#050607);
}

.scene-cult{
  background:
    radial-gradient(circle,#520000 0,#180000 35%,#030000 75%);
}

.scene-room{
  background:
    radial-gradient(circle at center,#242424,#090909 70%);
}

.scene-final{
  background:
    linear-gradient(130deg,#350000,#070707 55%,#00131b);
}

/* 地面 */
.floor{
  position:absolute;
  left:0;
  bottom:0;
  height:35%;
  width:100%;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
}

/* 場景標題 */
#location{
  position:absolute;
  top:11vh;
  left:5vw;
  font-size:14px;
  letter-spacing:4px;
  color:#aaa;
  opacity:0;
  transition:.7s;
  z-index:10;
}

/* 人物 */
.character{
  position:absolute;
  bottom:10vh;
  width:180px;
  height:420px;
  opacity:0;
  transition:
    left 1s ease,
    right 1s ease,
    opacity .7s ease,
    transform .7s ease;
  z-index:8;
}

.head{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#111;
  border:2px solid #555;
  margin:auto;
}

.body{
  width:125px;
  height:260px;
  background:linear-gradient(#161616,#050505);
  margin:-5px auto 0;
  border-radius:50px 50px 10px 10px;
}

.name{
  text-align:center;
  margin-top:10px;
  color:#aaa;
  font-size:13px;
  letter-spacing:2px;
}

#charLeft{
  left:7vw;
}

#charCenter{
  left:calc(50% - 90px);
}

#charRight{
  right:7vw;
}

.visible{
  opacity:1 !important;
}

/* 對話字幕 */
#subtitleBox{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:11vh;
  width:min(850px,90vw);
  text-align:center;
  z-index:30;
  opacity:0;
  transition:.3s;
}

#speaker{
  color:#c7c7c7;
  font-size:14px;
  letter-spacing:3px;
  margin-bottom:10px;
}

#subtitle{
  font-size:clamp(19px,2.5vw,30px);
  font-weight:bold;
  line-height:1.45;
  text-shadow:0 2px 8px black;
}

/* 旁白 */
#narration{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:80%;
  text-align:center;
  font-size:clamp(24px,4vw,55px);
  letter-spacing:4px;
  line-height:1.5;
  opacity:0;
  transition:1s;
  z-index:40;
}

/* 電影標題 */
#titleScreen{
  position:absolute;
  inset:0;
  background:black;
  z-index:80;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

#titleScreen h1{
  font-size:clamp(45px,8vw,100px);
  letter-spacing:8px;
  margin:0;
}

#titleScreen h2{
  color:#777;
  letter-spacing:5px;
  font-size:18px;
  font-weight:normal;
}

#start{
  margin-top:50px;
  padding:14px 35px;
  background:none;
  border:1px solid white;
  color:white;
  font-size:17px;
  cursor:pointer;
  letter-spacing:3px;
}

#start:hover{
  background:white;
  color:black;
}

/* 血紅閃光 */
#flash{
  position:absolute;
  inset:0;
  background:#790000;
  opacity:0;
  pointer-events:none;
  z-index:45;
}

/* 控制 */
#controls{
  position:absolute;
  top:10vh;
  right:4vw;
  z-index:60;
}

.control{
  background:rgba(0,0,0,.5);
  border:1px solid #555;
  color:white;
  padding:8px 14px;
  cursor:pointer;
}

/* 淡入淡出 */
#fade{
  position:absolute;
  inset:0;
  background:black;
  pointer-events:none;
  opacity:0;
  transition:.8s;
  z-index:70;
}

@media(max-width:600px){

.character{
  width:110px;
  height:300px;
}

.head{
  width:60px;
  height:60px;
}

.body{
  width:80px;
  height:190px;
}

}
</style>
</head>

<body>

<div id="movie">

<div id="background" class="scene-street"></div>

<div class="floor"></div>

<div id="location"></div>

<div id="narration"></div>

<div id="charLeft" class="character">
  <div class="head"></div>
  <div class="body"></div>
  <div class="name"></div>
</div>

<div id="charCenter" class="character">
  <div class="head"></div>
  <div class="body"></div>
  <div class="name"></div>
</div>

<div id="charRight" class="character">
  <div class="head"></div>
  <div class="body"></div>
  <div class="name"></div>
</div>

<div id="subtitleBox">
  <div id="speaker"></div>
  <div id="subtitle"></div>
</div>

<div id="flash"></div>
<div id="fade"></div>

<div id="controls">
  <button class="control" onclick="restartFilm()">↻ RESTART</button>
</div>

<div id="titleScreen">

<h1>救贖之影</h1>

<h2>SHADOW OF REDEMPTION</h2>

<button id="start" onclick="startFilm()">
START FILM
</button>

</div>

</div>


<script>

/* =====================================================
   劇本
===================================================== */

const script = [

/* ---------- OPENING ---------- */

{
type:"narration",
text:"FOUR DEATHS. ONE WORD.",
duration:3000
},

{
type:"scene",
scene:"street",
location:"CITY STREET — NIGHT"
},

{
type:"character",
position:"center",
name:"UNKNOWN MAN"
},

{
type:"dialogue",
speaker:"UNKNOWN MAN",
text:"This... is redemption, right?",
duration:3500
},

{
type:"flash"
},

{
type:"narration",
text:"THE FOURTH INCIDENT",
duration:2500
},


/* ---------- ACT 1 ---------- */

{
type:"scene",
scene:"police",
location:"POLICE DEPARTMENT — 11:47 PM"
},

{
type:"characters",
left:"ALAN",
right:"ANNA"
},

{
type:"dialogue",
speaker:"ALAN",
text:"Four people. Four identical cases. And we still don't know how they're connected.",
duration:5000
},

{
type:"dialogue",
speaker:"ANNA",
text:"Maybe they're not connected.",
duration:3000
},

{
type:"dialogue",
speaker:"ALAN",
text:"People can imitate a crime. They can't imitate something the press never reported.",
duration:5000
},

{
type:"dialogue",
speaker:"ANNA",
text:"What are you talking about?",
duration:3000
},

{
type:"dialogue",
speaker:"ALAN",
text:"Every body carried the same symbol.",
duration:4000
},

{
type:"dialogue",
speaker:"ALAN",
text:"You froze when you saw it.",
duration:3000
},

{
type:"dialogue",
speaker:"ANNA",
text:"I didn't freeze.",
duration:2500
},

{
type:"dialogue",
speaker:"ALAN",
text:"You did.",
duration:2200
},

{
type:"dialogue",
speaker:"ANNA",
text:"Maybe I just think it's ugly.",
duration:3200
},


/* ---------- INVESTIGATION ---------- */

{
type:"narration",
text:"THEY HAD NOTHING IN COMMON.",
duration:2600
},

{
type:"narration",
text:"EXCEPT DESPAIR.",
duration:2400
},

{
type:"scene",
scene:"room",
location:"ABANDONED BUILDING"
},

{
type:"characters",
left:"ALAN",
right:"ELENA"
},

{
type:"dialogue",
speaker:"ALAN",
text:"Elena. Look at me. You don't have to do this.",
duration:4500
},

{
type:"dialogue",
speaker:"ELENA",
text:"You don't understand.",
duration:3000
},

{
type:"dialogue",
speaker:"ALAN",
text:"Then help me understand.",
duration:3000
},

{
type:"dialogue",
speaker:"ELENA",
text:"He said the pain could disappear.",
duration:4000
},

{
type:"dialogue",
speaker:"ALAN",
text:"Who?",
duration:1800
},

{
type:"dialogue",
speaker:"ELENA",
text:"Morse.",
duration:2600
},


/* ---------- CULT ---------- */

{
type:"scene",
scene:"cult",
location:"THE SANCTUARY"
},

{
type:"characters",
center:"MORSE"
},

{
type:"dialogue",
speaker:"MORSE",
text:"They tell you your anger is wrong.",
duration:3500
},

{
type:"dialogue",
speaker:"MORSE",
text:"They tell you to forgive the people who destroyed you.",
duration:4500
},

{
type:"dialogue",
speaker:"MORSE",
text:"But I tell you something different.",
duration:3500
},

{
type:"dialogue",
speaker:"MORSE",
text:"Pain does not make you weak. Pain gives you purpose.",
duration:5000
},

{
type:"flash"
},


/* ---------- REVELATION ---------- */

{
type:"scene",
scene:"police",
location:"POLICE DEPARTMENT — LATER"
},

{
type:"characters",
left:"ALAN",
right:"ELENA"
},

{
type:"dialogue",
speaker:"ELENA",
text:"I've seen her before.",
duration:3000
},

{
type:"dialogue",
speaker:"ALAN",
text:"Who?",
duration:1800
},

{
type:"dialogue",
speaker:"ELENA",
text:"Your partner.",
duration:3000
},

{
type:"narration",
text:"THE TRUTH WAS NEVER FAR AWAY.",
duration:3000
},


/* ---------- FINAL ---------- */

{
type:"scene",
scene:"final",
location:"WAREHOUSE — MIDNIGHT"
},

{
type:"characters",
left:"ALAN",
right:"ANNA"
},

{
type:"dialogue",
speaker:"ALAN",
text:"How long?",
duration:2200
},

{
type:"dialogue",
speaker:"ANNA",
text:"Long enough.",
duration:2500
},

{
type:"dialogue",
speaker:"ALAN",
text:"Those people trusted you.",
duration:3000
},

{
type:"dialogue",
speaker:"ANNA",
text:"No. They trusted a world that abandoned them.",
duration:4500
},

{
type:"dialogue",
speaker:"ALAN",
text:"So you decided who deserved to live?",
duration:4000
},

{
type:"dialogue",
speaker:"ANNA",
text:"I gave them a choice.",
duration:3000
},

{
type:"dialogue",
speaker:"ALAN",
text:"You gave them a weapon.",
duration:3000
},

{
type:"flash"
},

{
type:"dialogue",
speaker:"ANNA",
text:"Walk away, Alan.",
duration:3000
},

{
type:"dialogue",
speaker:"ALAN",
text:"You know I can't.",
duration:3000
},

{
type:"flash"
},

{
type:"narration",
text:"NOT EVERYONE WHO SEEKS REDEMPTION FINDS SALVATION.",
duration:5000
},

{
type:"narration",
text:"SHADOW OF REDEMPTION",
duration:4500
},

{
type:"narration",
text:"THE END",
duration:5000
}

];


/* =====================================================
   電影引擎
===================================================== */

let running=false;
let index=0;

const bg=document.getElementById("background");
const locationText=document.getElementById("location");

const subtitleBox=document.getElementById("subtitleBox");
const speaker=document.getElementById("speaker");
const subtitle=document.getElementById("subtitle");

const narration=document.getElementById("narration");

const left=document.getElementById("charLeft");
const center=document.getElementById("charCenter");
const right=document.getElementById("charRight");

const fade=document.getElementById("fade");
const flash=document.getElementById("flash");


function sleep(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}


function hideCharacters(){

[left,center,right].forEach(c=>{
c.classList.remove("visible");
});

}


function characterName(element,name){

element.querySelector(".name").innerText=name;

}


async function startFilm(){

document.getElementById("titleScreen").style.display="none";

running=true;
index=0;

await play();

}


async function play(){

while(index<script.length && running){

const event=script[index];

await execute(event);

index++;

}

}


async function execute(e){


/* SCENE */

if(e.type==="scene"){

fade.style.opacity=1;

await sleep(700);

bg.className="";

bg.classList.add("scene-"+e.scene);

bg.style.transform="scale(1.05)";

hideCharacters();

locationText.innerText=e.location;
locationText.style.opacity=1;

await sleep(700);

fade.style.opacity=0;

await sleep(700);

return;

}


/* CHARACTER */

if(e.type==="character"){

hideCharacters();

let target=center;

if(e.position==="left")target=left;
if(e.position==="right")target=right;

characterName(target,e.name);

target.classList.add("visible");

await sleep(700);

return;

}


/* CHARACTERS */

if(e.type==="characters"){

hideCharacters();

if(e.left){
characterName(left,e.left);
left.classList.add("visible");
}

if(e.center){
characterName(center,e.center);
center.classList.add("visible");
}

if(e.right){
characterName(right,e.right);
right.classList.add("visible");
}

await sleep(700);

return;

}


/* DIALOGUE */

if(e.type==="dialogue"){

speaker.innerText=e.speaker;
subtitle.innerText=e.text;

subtitleBox.style.opacity=1;

speak(e.text,e.speaker);

await sleep(e.duration || 3500);

subtitleBox.style.opacity=0;

await sleep(350);

return;

}


/* NARRATION */

if(e.type==="narration"){

hideCharacters();

subtitleBox.style.opacity=0;

narration.innerText=e.text;

narration.style.opacity=1;

await sleep(e.duration || 3000);

narration.style.opacity=0;

await sleep(700);

return;

}


/* FLASH */

if(e.type==="flash"){

flash.style.opacity=.7;

await sleep(120);

flash.style.opacity=0;

await sleep(300);

return;

}

}


/* =====================================================
   AI 類語音
   使用瀏覽器 Speech Synthesis
===================================================== */

function speak(text,name){

if(!("speechSynthesis" in window))return;

speechSynthesis.cancel();

const voice=new SpeechSynthesisUtterance(text);

voice.lang="en-US";

voice.rate=.87;

voice.pitch=1;

if(name==="MORSE"){
voice.rate=.72;
voice.pitch=.75;
}

if(name==="ANNA"){
voice.pitch=.9;
}

if(name==="ELENA"){
voice.rate=.9;
voice.pitch=1.15;
}

speechSynthesis.speak(voice);

}


/* =====================================================
   RESTART
===================================================== */

function restartFilm(){

running=false;

speechSynthesis.cancel();

index=0;

hideCharacters();

subtitleBox.style.opacity=0;
narration.style.opacity=0;

setTimeout(()=>{

running=true;

play();

},500);

}

</script>

</body>
</html>
