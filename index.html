<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow of Redemption</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#movie{position:relative;width:100vw;height:100vh;background:#050505;overflow:hidden}

/* ===== 場景 ===== */
#scene{
 position:absolute;inset:0;
 transition:background 1s,transform 4s,filter 1s;
}

.street{
 background:
 linear-gradient(90deg,transparent 48%,rgba(255,220,150,.12) 50%,transparent 52%),
 linear-gradient(#07101b 0 60%,#111 60%);
}

.police{
 background:
 linear-gradient(90deg,transparent 65%,rgba(100,170,220,.12)),
 linear-gradient(#15202b 0 65%,#242424 65%);
}

.abandoned{
 background:
 linear-gradient(120deg,#151515,#252525 45%,#080808);
}

.cult{
 background:
 radial-gradient(circle at 50% 30%,#5d0808,#180303 45%,#020202 80%);
}

.warehouse{
 background:
 linear-gradient(115deg,#07121a,#181818 45%,#260303);
}

/* ===== 場景物件 ===== */
#props{position:absolute;inset:0}

.desk{
 position:absolute;
 width:45%;height:12%;
 background:#201a17;
 bottom:18%;left:28%;
 box-shadow:0 10px 30px #000;
}

.window{
 position:absolute;
 width:25%;height:35%;
 right:8%;top:17%;
 border:8px solid #151515;
 background:linear-gradient(#071321,#142235);
}

.board{
 position:absolute;
 width:35%;height:28%;
 left:8%;top:20%;
 background:#37322d;
 border:7px solid #1c1815;
}

.light{
 position:absolute;
 width:170px;height:170px;
 border-radius:50%;
 background:rgba(255,230,180,.12);
 filter:blur(20px);
 top:15%;left:45%;
}

/* ===== 人物 ===== */
.character{
 position:absolute;
 width:160px;height:420px;
 bottom:9%;
 opacity:0;
 transition:all 1s ease;
 z-index:10;
 filter:drop-shadow(0 15px 12px #000);
}

.character.show{opacity:1}

.left{left:10%}
.center{left:calc(50% - 80px)}
.right{right:10%}

.person{
 position:relative;
 width:100%;height:100%;
}

.hair{
 position:absolute;
 width:86px;height:60px;
 left:37px;top:5px;
 background:#17120f;
 border-radius:50% 50% 30% 30%;
 z-index:4;
}

.face{
 position:absolute;
 width:76px;height:90px;
 left:42px;top:28px;
 background:#d6a078;
 border-radius:45% 45% 48% 48%;
 z-index:3;
}

.eye{
 position:absolute;
 width:7px;height:5px;
 background:#161616;
 top:39px;
 border-radius:50%;
}

.eye.l{left:18px}
.eye.r{right:18px}

.nose{
 position:absolute;
 width:4px;height:13px;
 background:#aa7559;
 left:36px;top:47px;
}

.mouth{
 position:absolute;
 width:18px;height:3px;
 background:#683d35;
 left:29px;top:69px;
}

.neck{
 position:absolute;
 width:30px;height:35px;
 left:65px;top:103px;
 background:#c58f69;
}

.torso{
 position:absolute;
 width:110px;height:180px;
 left:25px;top:125px;
 background:#151a20;
 border-radius:25px 25px 8px 8px;
}

.arm{
 position:absolute;
 width:30px;height:175px;
 background:#151a20;
 top:135px;
 border-radius:20px;
 transform-origin:top center;
}

.arm.leftarm{left:12px;transform:rotate(5deg)}
.arm.rightarm{right:12px;transform:rotate(-5deg)}

.leg{
 position:absolute;
 width:43px;height:130px;
 background:#101114;
 top:290px;
}

.leg.l{left:34px}
.leg.r{right:34px}

.charName{
 position:absolute;
 width:200px;
 left:-20px;
 bottom:-25px;
 text-align:center;
 color:#aaa;
 font-size:11px;
 letter-spacing:3px;
}

/* Anna */
.anna .hair{
 height:110px;
 background:#241712;
}

.anna .torso,
.anna .arm{
 background:#20242b;
}

/* Elena */
.elena{transform:scale(.92)}
.elena .hair{background:#332018;height:120px}
.elena .torso,.elena .arm{background:#34343b}

/* Morse */
.morse .hair{background:#191919}
.morse .torso,.morse .arm{background:#090909}
.morse .face{background:#c88e68}

/* ===== 電影黑邊 ===== */
.cinemaBar{
 position:absolute;left:0;width:100%;height:7%;
 background:#000;z-index:50
}
.topbar{top:0}
.bottombar{bottom:0}

/* ===== 地點 ===== */
#location{
 position:absolute;
 top:10%;
 left:4%;
 color:#bbb;
 font-size:12px;
 letter-spacing:4px;
 z-index:40;
}

/* ===== 字幕 ===== */
#subtitle{
 position:absolute;
 width:90%;
 max-width:950px;
 left:50%;
 transform:translateX(-50%);
 bottom:10%;
 text-align:center;
 color:white;
 z-index:60;
 text-shadow:0 3px 8px #000;
}

#speaker{
 color:#aaa;
 font-size:12px;
 letter-spacing:3px;
 margin-bottom:8px;
}

#line{
 font-size:clamp(18px,2.5vw,29px);
 font-weight:bold;
 line-height:1.4;
}

/* ===== 開場 ===== */
#start{
 position:absolute;inset:0;
 z-index:100;
 background:
 radial-gradient(circle,#380505,#090909 50%,#000);
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 color:white;
 text-align:center;
}

#start h1{
 font-size:clamp(45px,8vw,95px);
 letter-spacing:8px;
 margin:0;
}

#start h2{
 color:#888;
 letter-spacing:5px;
 font-weight:normal;
}

button{
 background:transparent;
 color:white;
 border:1px solid white;
 padding:14px 30px;
 margin-top:30px;
 cursor:pointer;
 letter-spacing:3px;
}

button:hover{background:white;color:black}

/* ===== ACT ===== */
#act{
 position:absolute;inset:0;
 background:#000;
 color:white;
 z-index:80;
 display:none;
 align-items:center;
 justify-content:center;
 flex-direction:column;
}

#act small{letter-spacing:6px;color:#777}
#act h1{font-size:50px;letter-spacing:7px}

/* ===== 閃光 ===== */
#flash{
 position:absolute;inset:0;
 background:#8d0000;
 opacity:0;
 z-index:70;
 pointer-events:none;
}

/* ===== 鏡頭 ===== */
.closeup{transform:scale(1.22)}
.shake{animation:shake .3s}

@keyframes shake{
 0%{transform:translate(0)}
 25%{transform:translate(-10px,4px)}
 50%{transform:translate(8px,-3px)}
 75%{transform:translate(-5px,2px)}
 100%{transform:translate(0)}
}

@media(max-width:600px){
.character{transform:scale(.7);transform-origin:bottom}
.left{left:0}
.right{right:0}
.center{left:calc(50% - 80px)}
}
</style>
</head>

<body>

<div id="movie">

<div id="scene"></div>

<div id="props"></div>

<div id="location"></div>

<div id="alan" class="character left">
 <div class="person">
  <div class="hair"></div>
  <div class="face">
   <div class="eye l"></div><div class="eye r"></div>
   <div class="nose"></div><div class="mouth"></div>
  </div>
  <div class="neck"></div>
  <div class="torso"></div>
  <div class="arm leftarm"></div><div class="arm rightarm"></div>
  <div class="leg l"></div><div class="leg r"></div>
  <div class="charName">ALAN</div>
 </div>
</div>

<div id="anna" class="character anna right">
 <div class="person">
  <div class="hair"></div>
  <div class="face">
   <div class="eye l"></div><div class="eye r"></div>
   <div class="nose"></div><div class="mouth"></div>
  </div>
  <div class="neck"></div>
  <div class="torso"></div>
  <div class="arm leftarm"></div><div class="arm rightarm"></div>
  <div class="leg l"></div><div class="leg r"></div>
  <div class="charName">ANNA</div>
 </div>
</div>

<div id="elena" class="character elena right">
 <div class="person">
  <div class="hair"></div>
  <div class="face">
   <div class="eye l"></div><div class="eye r"></div>
   <div class="nose"></div><div class="mouth"></div>
  </div>
  <div class="neck"></div>
  <div class="torso"></div>
  <div class="arm leftarm"></div><div class="arm rightarm"></div>
  <div class="leg l"></div><div class="leg r"></div>
  <div class="charName">ELENA</div>
 </div>
</div>

<div id="morse" class="character morse center">
 <div class="person">
  <div class="hair"></div>
  <div class="face">
   <div class="eye l"></div><div class="eye r"></div>
   <div class="nose"></div><div class="mouth"></div>
  </div>
  <div class="neck"></div>
  <div class="torso"></div>
  <div class="arm leftarm"></div><div class="arm rightarm"></div>
  <div class="leg l"></div><div class="leg r"></div>
  <div class="charName">MORSE</div>
 </div>
</div>

<div id="subtitle">
 <div id="speaker"></div>
 <div id="line"></div>
</div>

<div id="act">
 <small id="actNumber"></small>
 <h1 id="actTitle"></h1>
</div>

<div id="flash"></div>

<div class="cinemaBar topbar"></div>
<div class="cinemaBar bottombar"></div>

<div id="start">
 <h1>救贖之影</h1>
 <h2>SHADOW OF REDEMPTION</h2>
 <button onclick="begin()">▶ START FILM</button>
</div>

</div>

<script>

const scenes=[
{
 act:"ACT I",
 title:"THE CASES",
 place:"POLICE DEPARTMENT — NIGHT",
 bg:"police",
 people:["alan","anna"],
 speaker:"ALAN",
 line:"Four people. Four identical cases. And we still don't know how they're connected."
},
{
 place:"POLICE DEPARTMENT — NIGHT",
 bg:"police",
 people:["alan","anna"],
 speaker:"ANNA",
 line:"Maybe they're not connected."
},
{
 place:"POLICE DEPARTMENT — NIGHT",
 bg:"police",
 people:["alan","anna"],
 speaker:"ALAN",
 line:"People can imitate a crime. They can't imitate something the press never reported.",
 camera:"close"
},
{
 place:"POLICE DEPARTMENT — NIGHT",
 bg:"police",
 people:["alan","anna"],
 speaker:"ALAN",
 line:"Every body carried the same symbol."
},
{
 place:"POLICE DEPARTMENT — NIGHT",
 bg:"police",
 people:["alan","anna"],
 speaker:"ALAN",
 line:"You froze when you saw it."
},
{
 place:"POLICE DEPARTMENT — NIGHT",
 bg:"police",
 people:["alan","anna"],
 speaker:"ANNA",
 line:"Maybe I just think it's ugly."
},

{
 act:"ACT II",
 title:"THE HUNT",
 place:"ABANDONED BUILDING",
 bg:"abandoned",
 people:["alan","elena"],
 speaker:"ALAN",
 line:"Elena. Look at me. You don't have to do this."
},
{
 place:"ABANDONED BUILDING",
 bg:"abandoned",
 people:["alan","elena"],
 speaker:"ELENA",
 line:"You don't understand."
},
{
 place:"ABANDONED BUILDING",
 bg:"abandoned",
 people:["alan","elena"],
 speaker:"ALAN",
 line:"Then help me understand."
},
{
 place:"ABANDONED BUILDING",
 bg:"abandoned",
 people:["alan","elena"],
 speaker:"ELENA",
 line:"He said the pain could disappear."
},
{
 place:"ABANDONED BUILDING",
 bg:"abandoned",
 people:["alan","elena"],
 speaker:"ALAN",
 line:"Who?"
},
{
 place:"ABANDONED BUILDING",
 bg:"abandoned",
 people:["alan","elena"],
 speaker:"ELENA",
 line:"Morse."
},

{
 act:"ACT III",
 title:"THE SANCTUARY",
 place:"THE SANCTUARY",
 bg:"cult",
 people:["morse"],
 speaker:"MORSE",
 line:"They tell you your anger is wrong."
},
{
 place:"THE SANCTUARY",
 bg:"cult",
 people:["morse"],
 speaker:"MORSE",
 line:"They tell you to forgive the people who destroyed you."
},
{
 place:"THE SANCTUARY",
 bg:"cult",
 people:["morse"],
 speaker:"MORSE",
 line:"Pain does not make you weak. Pain gives you purpose.",
 camera:"close"
},

{
 act:"ACT IV",
 title:"THE TRUTH",
 place:"POLICE DEPARTMENT — LATER",
 bg:"police",
 people:["alan","elena"],
 speaker:"ELENA",
 line:"I've seen her before."
},
{
 place:"POLICE DEPARTMENT — LATER",
 bg:"police",
 people:["alan","elena"],
 speaker:"ALAN",
 line:"Who?"
},
{
 place:"POLICE DEPARTMENT — LATER",
 bg:"police",
 people:["alan","elena"],
 speaker:"ELENA",
 line:"Your partner."
},

{
 act:"FINAL ACT",
 title:"CONFRONTATION",
 place:"WAREHOUSE — MIDNIGHT",
 bg:"warehouse",
 people:["alan","anna"],
 speaker:"ALAN",
 line:"How long?"
},
{
 place:"WAREHOUSE — MIDNIGHT",
 bg:"warehouse",
 people:["alan","anna"],
 speaker:"ANNA",
 line:"Long enough."
},
{
 place:"WAREHOUSE — MIDNIGHT",
 bg:"warehouse",
 people:["alan","anna"],
 speaker:"ALAN",
 line:"Those people trusted you."
},
{
 place:"WAREHOUSE — MIDNIGHT",
 bg:"warehouse",
 people:["alan","anna"],
 speaker:"ANNA",
 line:"They trusted a world that abandoned them."
},
{
 place:"WAREHOUSE — MIDNIGHT",
 bg:"warehouse",
 people:["alan","anna"],
 speaker:"ALAN",
 line:"So you decided who deserved to live?"
},
{
 place:"WAREHOUSE — MIDNIGHT",
 bg:"warehouse",
 people:["alan","anna"],
 speaker:"ANNA",
 line:"I gave them a choice."
},
{
 place:"WAREHOUSE — MIDNIGHT",
 bg:"warehouse",
 people:["alan","anna"],
 speaker:"ALAN",
 line:"You gave them a weapon.",
 shake:true
},
{
 place:"WAREHOUSE — MIDNIGHT",
 bg:"warehouse",
 people:["alan","anna"],
 speaker:"ANNA",
 line:"Walk away, Alan."
},
{
 place:"WAREHOUSE — MIDNIGHT",
 bg:"warehouse",
 people:["alan","anna"],
 speaker:"ALAN",
 line:"You know I can't.",
 camera:"close"
}
];

let i=0;

const ids=["alan","anna","elena","morse"];

function sleep(ms){
 return new Promise(r=>setTimeout(r,ms));
}

async function begin(){
 document.getElementById("start").style.display="none";
 await play();
}

async function play(){

 if(i>=scenes.length){
   endMovie();
   return;
 }

 const s=scenes[i];

 if(s.act){
   await showAct(s.act,s.title);
 }

 setScene(s);
 speak(s.line,s.speaker);

 await sleep(4500);

 i++;
 play();
}

function setScene(s){

 const scene=document.getElementById("scene");

 scene.className=s.bg;

 scene.classList.remove("closeup");

 if(s.camera==="close"){
   scene.classList.add("closeup");
 }

 document.getElementById("location").innerText=s.place;
 document.getElementById("speaker").innerText=s.speaker;
 document.getElementById("line").innerText=s.line;

 ids.forEach(id=>{
   document.getElementById(id).classList.remove("show");
 });

 s.people.forEach(id=>{
   document.getElementById(id).classList.add("show");
 });

 buildProps(s.bg);

 if(s.shake){
   document.getElementById("movie").classList.add("shake");
   flash();
   setTimeout(()=>{
     document.getElementById("movie").classList.remove("shake");
   },400);
 }
}

function buildProps(bg){

 const props=document.getElementById("props");

 props.innerHTML="";

 if(bg==="police"){
   props.innerHTML=
   '<div class="window"></div>'+
   '<div class="board"></div>'+
   '<div class="desk"></div>';
 }

 if(bg==="cult"){
   props.innerHTML='<div class="light"></div>';
 }

 if(bg==="warehouse"){
   props.innerHTML='<div class="light"></div>';
 }
}

async function showAct(number,title){

 const a=document.getElementById("act");

 document.getElementById("actNumber").innerText=number;
 document.getElementById("actTitle").innerText=title;

 a.style.display="flex";

 await sleep(2200);

 a.style.display="none";
}

function speak(text,name){

 if(!("speechSynthesis" in window))return;

 speechSynthesis.cancel();

 const u=new SpeechSynthesisUtterance(text);

 u.lang="en-US";

 if(name==="ALAN"){
   u.rate=.88;
   u.pitch=.82;
 }

 if(name==="ANNA"){
   u.rate=.9;
   u.pitch=1.02;
 }

 if(name==="ELENA"){
   u.rate=.88;
   u.pitch=1.15;
 }

 if(name==="MORSE"){
   u.rate=.7;
   u.pitch=.65;
 }

 speechSynthesis.speak(u);
}

async function flash(){

 const f=document.getElementById("flash");

 f.style.opacity=".65";

 await sleep(100);

 f.style.opacity="0";
}

function endMovie(){

 speechSynthesis.cancel();

 ids.forEach(id=>{
   document.getElementById(id).classList.remove("show");
 });

 document.getElementById("location").innerText="";
 document.getElementById("speaker").innerText="";
 document.getElementById("line").innerHTML=
 "<span style='font-size:45px;letter-spacing:7px'>THE END</span><br><br>SHADOW OF REDEMPTION";
}
</script>

</body>
</html>
